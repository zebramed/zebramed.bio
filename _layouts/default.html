<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site.title }} | {{ page.title | default: site.description }}</title>
    <!-- Set before first paint so figures that build up with motion start empty (motion.js keeps it current). -->
    <script>document.documentElement.dataset.motion = matchMedia('(prefers-reduced-motion: reduce)').matches ? 'reduced' : 'playing';</script>
    
    <!-- Preload critical assets -->
    <link rel="preload" href="{{ '/assets/css/tailwind.css' | relative_url }}" as="style">
    <link rel="preload" href="{{ '/assets/css/main.css' | relative_url }}" as="style">
    <link rel="preload" href="{{ '/assets/fonts/inter/Inter-Regular.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="{{ '/assets/fonts/inter/Inter-SemiBold.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
    
    <!-- Tailwind CSS (local) -->
    <link rel="stylesheet" href="{{ '/assets/css/tailwind.css' | relative_url }}">
    
    <!-- Favicons -->
    <link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
    <link rel="apple-touch-icon" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">

    <meta name="theme-color" content="#11174a">
    
    <!-- Additional SEO meta tags -->
    <meta name="robots" content="index, follow">
    <meta name="author" content="ZebraMed">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
    {% seo %}
    
    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "{{ site.title }}",
        "url": "{{ site.url }}",
        "logo": "{{ site.url }}/assets/images/zebramed_logo.svg",
        "description": "{{ site.description }}",
        "address": {
            "@type": "PostalAddress",
            "streetAddress": "Pépinière Genopole Entreprises, 4 rue Pierre Fontaine",
            "addressLocality": "Évry-Courcouronnes",
            "postalCode": "91000",
            "addressCountry": "FR"
        },
        "contactPoint": {
            "@type": "ContactPoint",
            "email": "{{ site.email }}",
            "contactType": "General Inquiry"
        },
        "sameAs": [
            "https://www.linkedin.com/company/zebramed"
        ],
        "vatID": "FR09988494795",
        "foundingDate": "2025"
    }
    </script>
</head>
<body class="overflow-x-hidden antialiased">

    <a href="#main-content" class="sr-only focus:not-sr-only focus:absolute focus:top-4 focus:left-4 focus:z-50 focus:px-4 focus:py-2 focus:bg-accent-primary focus:text-bg-dark focus:rounded-md">Skip to main content</a>
    
    {% include header.html %}

    <main id="main-content" role="main">
        {{ content }}
    </main>

    {% include footer.html %}

    <script src="{{ '/assets/js/main.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/motion.js' | relative_url }}"></script>
    <script src="{{ '/assets/js/platform.js' | relative_url }}"></script>
</body>
</html>
