{%- comment -%} Off the home page, section links go back to it. {%- endcomment -%}
{%- assign home = '' -%}{%- unless page.url == '/' -%}{%- assign home = '/' | relative_url -%}{%- endunless -%}
<header class="site-header" id="site-header" role="banner">
    <div class="wrap header-bar">
        <a href="{{ home }}#" class="brand" aria-label="ZebraMed, back to top">
            <span class="logo-mask" aria-hidden="true"></span>
            <span class="brand-title"><span class="text-text-light">Zebra</span><span class="gradient-text">Med</span></span>
        </a>

        <nav class="nav" aria-label="Main navigation">
            <a href="{{ home }}#problem" class="nav-link">Problem</a>
            <a href="{{ home }}#offer" class="nav-link">Offer</a>
            <a href="{{ home }}#platform" class="nav-link">Platform</a>
            <a href="{{ home }}#team" class="nav-link">Team</a>
            <a href="{{ home }}#traction" class="nav-link">Traction</a>
        </nav>

        <div class="header-actions">
            <a href="mailto:{{ site.email }}" class="btn btn-solid btn-sm" aria-label="Email ZebraMed">Contact us</a>

            <button id="mobile-menu-btn" class="menu-btn" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="mobile-menu">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                    <path class="menu-icon" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                    <path class="close-icon hidden" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
    </div>

    <nav id="mobile-menu" class="wrap hidden" aria-label="Mobile navigation">
        <div class="mobile-nav">
            <a href="{{ home }}#problem" class="nav-link">Problem</a>
            <a href="{{ home }}#offer" class="nav-link">Offer</a>
            <a href="{{ home }}#platform" class="nav-link">Platform</a>
            <a href="{{ home }}#team" class="nav-link">Team</a>
            <a href="{{ home }}#traction" class="nav-link">Traction</a>
        </div>
    </nav>
</header>
