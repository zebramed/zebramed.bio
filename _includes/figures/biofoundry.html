{% comment %}
Platform figure 1: the biofoundry. A chip of wells in four arms and one larva
imaged from the side. Drawn at 420 wide so its labels stay above ~12px on a
phone; nothing smaller goes in. Layout and values are fictional.
{% endcomment %}
<svg class="plate-svg" viewBox="0 0 420 310" role="img"
     aria-label="The biofoundry, illustrated. A chip of wells in four arms, vehicle and three doses (low, mid, high), with two wells excluded at quality control. Below, a larva imaged from the side, the same individual over several days. Fictional layout.">
    <g transform="translate(40,40)">
        {% for r in (0..3) %}{% for c in (0..7) %}{% assign cx = c | times: 28 %}{% assign cy = r | times: 24 %}{% assign arm = c | divided_by: 2 %}{% assign k = r | times: 8 | plus: c %}
        {% if k == 10 or k == 29 %}<circle class="flag" cx="{{ cx }}" cy="{{ cy }}" r="8"/>
        {% else %}<circle class="hair-2" cx="{{ cx }}" cy="{{ cy }}" r="8"/>
        {% if arm == 0 %}<circle class="hair-2" cx="{{ cx }}" cy="{{ cy }}" r="2.5"/>
        {% else %}<circle class="live-f" cx="{{ cx }}" cy="{{ cy }}" r="4.5" fill-opacity="{{ arm | times: 0.25 | plus: 0.25 }}"/>{% endif %}{% endif %}
        {% endfor %}{% endfor %}
    </g>
    <text class="f-label" x="54" y="146" text-anchor="middle">vehicle</text>
    <text class="f-label" x="110" y="146" text-anchor="middle">low</text>
    <text class="f-label" x="166" y="146" text-anchor="middle">mid</text>
    <text class="f-label" x="222" y="146" text-anchor="middle">high</text>

    <g transform="translate(272,0)">
        <circle class="hair-2" cx="8" cy="52" r="8"/><circle class="live-f" cx="8" cy="52" r="4.5" fill-opacity="0.75"/>
        <text class="f-label" x="26" y="57">dosed</text>
        <circle class="hair-2" cx="8" cy="82" r="8"/><circle class="hair-2" cx="8" cy="82" r="2.5"/>
        <text class="f-label" x="26" y="87">vehicle</text>
        <circle class="flag" cx="8" cy="112" r="8"/>
        <text class="f-label" x="26" y="117">excluded at QC</text>
    </g>

    <rect class="hair" x="30" y="176" width="360" height="116" rx="10"/>
    <text class="f-label" x="46" y="200">lateral imaging, same larva over days</text>
    <g class="larva" transform="translate(70,196) scale(2.7)">
        <path class="hair-2" d="M8 18 C14 8 30 8 40 12 C55 15 75 16 98 15 L98 19 C75 20 55 22 42 24 C34 27 24 32 16 28 C9 25 6 22 8 18 Z"/>
        <line class="hair" x1="40" y1="15" x2="98" y2="17"/>
        <ellipse class="hair-2" cx="24" cy="25" rx="8" ry="4.5"/>
        <circle class="hair-2" cx="16" cy="16" r="2.2"/>
        <rect class="live" x="27" y="18" width="8" height="6" rx="1" stroke-dasharray="2 1.5"/>
        <rect class="live" x="46" y="10" width="11" height="6" rx="1" stroke-dasharray="2 1.5"/>
    </g>
</svg>
