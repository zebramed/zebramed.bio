# What we offer: one card per development stage, each ending in the decisions
# it supports. The wording keeps to what the platform section already claims.
title: What we offer
lede: >-
  Each engagement answers a decision a programme team takes before the clinic.
  We start from the client's existing data and our systemic graph, and run new
  whole-organism experiments only where XenoEx is not yet confident. The way in
  is a validation pilot.
stages:
  - stage: Discovery
    title: Target identification and prioritisation
    text: >-
      XenoEx follows a disease through the systemic graph, from the organs it
      affects to the molecular signals between them, and proposes targets, each
      with the mechanistic path that supports it, so teams see which hypotheses
      deserve chemistry before it is committed.
    benefits:
      - Novel targets, ranked
      - A mechanistic path behind every target
      - Chemistry committed to the strongest hypotheses
  - stage: Lead optimisation
    title: Systemic efficacy and toxicity profiling
    text: >-
      XenoEx scores each candidate for systemic efficacy and multi-organ
      toxicity from the client's existing data and the systemic graph, and
      reads the result in human terms. Candidates it cannot score with
      confidence run on whole zebrafish larvae in the biofoundry, so the series
      is ranked on whole-body evidence before the first rodent study.
    benefits:
      - Candidate ranking with an auditable rationale
      - Wet-lab runs only where they change the answer
      - Liabilities flagged before the first mammalian cohort
  - stage: Preclinical development
    title: Asset re-evaluation and go/no-go
    text: >-
      Shelved and stalled assets get a second look against whole-organism data
      and human pathobiology. Data from a client's own models, such as cell
      lines, organoids or other species, joins the same graph, so earlier
      results can be read in human terms ahead of IND.
    benefits:
      - A second look at shelved assets
      - Existing data read in human terms
      - Go/no-go evidence ahead of IND
