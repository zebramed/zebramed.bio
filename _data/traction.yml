# Traction items. An item with `pending:` is not cleared for publication:
# review builds show it with the reason in amber, production builds
# (JEKYLL_ENV=production) leave it out. Delete the `pending:` line to publish.
# See docs/ceo-copy-merge.md §4 for the reasoning behind each.
# `lede` is the phrase each feature adds to the section's one-line summary.
# `logos` are shown on light tiles at the foot of the card (files in
# assets/images); a logo without `file` renders as its name.
features:
  - kicker: Pharma
    lede: pharma partnerships
    title: Under contract with a top-50 pharma company
    text: >-
      A paid contract with a top-50 pharma company, and a collaborative project
      on New Approach Methodologies (NAMs) started with a second pharma company.
    logos:
      - name: Servier
        file: servier_logo.svg
      - name: Ipsen
        file: ipsen_logo.svg
  - kicker: Research collaborations
    lede: research collaborations
    title: Joint research with TEFOR (CNRS/CEA) and Sorbonne ISIR
    text: >-
      Active collaborations on zebrafish resources and automation.
    logos:
      - name: TEFOR
        file: tefor_logo.png
      #- name: Institut Imagine
      #  file: imagine_logo.png
      - name: ISIR, Sorbonne Université
        file: isir_logo.png
  - kicker: Acceleration programmes
    lede: acceleration programmes
    title: Selected by three leading acceleration programmes
    text: >-
      Creative Destruction Lab, HEC Paris Challenge+ and DayOne in Basel.
    logos:
      - name: Creative Destruction Lab
        file: cdl_logo.svg
      - name: HEC Paris Challenge+
        file: hec_challenge_logo.png
      - name: DayOne, Basel
        file: dayone_logo.svg
  - kicker: Awards and grants
    lede: awards and grants
    title: Awards and grants received
    text: >-
      Recognition through various awards and non-dilutive grants supporting our research and development efforts.
    logos:
      - name: Datacraft Awards
        file: datacraft_logo.jpg
      - name: Deeptech Pioneers
        file: deeptech_pioneers_logo.jpg
      - name: i-Lab Awards
        file: logo_ilab.webp
measures:
  - value: "2"
    label: contracts and collaborations running
  - value: "1 + 6"
    label: patent applications, one priority filed and six planned; freedom to operate cleared
  - value: "4"
    label: non-dilutive grants awarded
