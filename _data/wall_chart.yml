# Figure 2: the systemic biology wall.
# Source: Jayatunga, Ayers, Bruens, Jayanth & Meier (Boston Consulting Group),
# "How successful are AI-discovered drugs in clinical trials? A first analysis
# and emerging lessons", Drug Discovery Today 29(6):104009, 2024
# (doi:10.1016/j.drudis.2024.104009). Abstract: AI-discovered molecules succeed
# 80-90% in Phase I, "substantially higher than historic industry averages"
# (the paper benchmarks these at roughly 40-65%), and ~40% in Phase II,
# "comparable to historic industry averages".
# Plotted: share of molecules entering Phase I still advancing at the end of
# each phase, using the midpoints. AI: 85%, then 85 x 0.40 = 34%. Historic:
# 52.5%, then 52.5 x 0.40 = 21%. x runs from 0 (Phase I start) to 1 (end of
# Phase II); the study does not cover preclinical attrition.
status: sourced          # pending | sourced. "sourced" adds the numbered y axis; "pending" shows a badge in review builds
y_label: Molecules still advancing
phases:
  - label: Phase I
    sub: safety, first in humans
    from: 0.0
    to: 0.5
  - label: Phase II
    sub: efficacy, in patients
    from: 0.5
    to: 1.0
wall:
  from: 0.5
  to: 1.0
  label: The systemic biology wall
series:
  - name: Historic industry average
    style: base
    points: "0,100 0.5,52.5 1,21"
  - name: AI-discovered molecules
    style: live
    points: "0,100 0.5,85 1,34"
caption: >-
  Share of molecules still advancing after each clinical phase. AI-discovered
  molecules pass Phase I 80 to 90% of the time, against a historic 40 to 65%,
  then fail Phase II as often as ever (about 40% succeed). Midpoints plotted.
source: >-
  Source: Jayatunga et al., Boston Consulting Group,
  <a href="https://doi.org/10.1016/j.drudis.2024.104009">Drug Discovery Today, 2024</a>.
